ai_disclosure:
  # Written by the author; the model checks it against the repo. One source, two consumers: the colophon
  # template and /llms.txt both print this field, so it cannot refer to "this page".
  en: "The site and its pages were built and drafted with Claude Code from a written spec and edited by me. The articles are written by me. Before one is published, an agent with access to the repositories the article is about checks every claim that code or its history can settle and marks it confirmed, wrong or unverifiable; the claims no repository can settle I check by hand against their sources. In editing, a model may flag, question and suggest, and may propose a reformulation of a sentence, never a rewritten paragraph. Translations start from a model’s pass and are rewritten by me. The judgment and the mistakes are mine."
  # ro has no consumer yet (the colophon is EN-only); kept ready for the day a Romanian page carries the disclosure.
  ro: "Site-ul și paginile lui au fost construite și redactate cu Claude Code, pornind de la o specificație scrisă, și editate de mine. Articolele le scriu eu. Înainte de publicare, un agent cu acces la repository-urile despre care e vorba în articol verifică fiecare afirmație pe care codul sau istoricul lui o pot clarifica și o marchează confirmată, greșită sau neverificabilă; afirmațiile pe care niciun repository nu le poate clarifica le verific eu, la sursă. La editare, un model poate semnala, întreba și sugera, și poate propune reformularea unei propoziții, dar nu și rescrierea unui paragraf. Traducerile pornesc de la o primă versiune generată de un model și sunt rescrise de mine. Judecata și greșelile îmi aparțin."
