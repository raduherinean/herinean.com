name = "herinean-com"
main = "worker/index.js"
compatibility_date = "2026-09-01"
workers_dev = false
preview_urls = true

routes = [
  { pattern = "herinean.com", custom_domain = true },
  { pattern = "mta-sts.herinean.com", custom_domain = true },
]

[assets]
directory = "./dist"
binding = "ASSETS"
html_handling = "force-trailing-slash"
not_found_handling = "404-page"
# The Worker runs only for page routes. Fonts, images, OG cards, feeds and machine files come straight from the asset layer.
run_worker_first = ["/*", "!/img/*", "!/og/*", "!/feed.*", "!/sitemap.xml", "!/favicon*", "!/apple-touch-icon*", "!/fonts/*"]

[vars]
PROD_HOST = "herinean.com"   # wrangler dev presents requests with the first route's host, so the production path runs locally by default; --var PROD_HOST:other simulates a preview host

# One datapoint per HTML view: path, lang, referrer host, ref, country, 1 — nothing else (spec §6.3).
[[analytics_engine_datasets]]
binding = "VIEWS"
dataset = "herinean_views"

# The colophon scorecard: an HTML fragment and its JSON (spec §7). CI writes the CI rows before each
# `wrangler deploy` (and, before launch, on every green push to main), then CI + post rows once tier 1
# has verified production; a failed verification restores the previous build's rows with its rollback.
[[kv_namespaces]]
binding = "SCORECARD"
id = "62348f3926714d6085de6fbcd775481a"
