name: audit
on:
  workflow_call:
    inputs:
      base: { type: string, required: true }
      mode: { type: string, required: true }        # ci | post
      shards: { type: string, required: true }      # JSON array, e.g. ["1/2","2/2"]
      artifact: { type: string, default: "" }       # dist artifact to serve (ci mode)
      link: { type: string, required: true }        # the run URL, printed as "verify it yourself"
    outputs:
      pass: { value: "${{ jobs.merge.outputs.pass }}" }
permissions: { contents: read }
env: { NODE_OPTIONS: --max-old-space-size=4096 }
jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: { form-factor: [mobile, desktop], shard: "${{ fromJSON(inputs.shards) }}" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .node-version, cache: npm, cache-dependency-path: bench/package-lock.json }
      - run: cd bench && npm ci
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: { path: ~/.cache/ms-playwright, key: "playwright-${{ runner.os }}-${{ hashFiles('bench/package-lock.json') }}" }
      - run: cd bench && npx playwright install --with-deps chromium
      - if: inputs.mode == 'ci'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: "${{ inputs.artifact }}", path: . }
      - if: inputs.mode == 'ci'
        run: |
          chmod +x site && ./site serve --static --port 8080 &
          for _ in $(seq 1 50); do curl -sf -o /dev/null http://127.0.0.1:8080/ && break; sleep 0.2; done
      # Filenames carry form-factor and job-index: two shards' rows would otherwise share the
      # name "rows-lighthouse.json" and one would overwrite the other under merge-multiple in `merge`.
      - run: node bench/audit.mjs "${{ inputs.base }}" --mode ${{ inputs.mode }} --only lighthouse --form-factor ${{ matrix.form-factor }} --shard ${{ matrix.shard }} --link "${{ inputs.link }}" --out rows-lighthouse-${{ matrix.form-factor }}-${{ strategy.job-index }}.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: "rows-${{ inputs.mode }}-lighthouse-${{ matrix.form-factor }}-${{ strategy.job-index }}", path: rows-lighthouse-*.json*, overwrite: true }
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .node-version, cache: npm, cache-dependency-path: bench/package-lock.json }
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with: { distribution: temurin, java-version: "21" }
      - run: cd bench && npm ci
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: { path: ~/.cache/ms-playwright, key: "playwright-${{ runner.os }}-${{ hashFiles('bench/package-lock.json') }}" }
      - run: cd bench && npx playwright install --with-deps chromium
      # The Font correctness row measures the fallback against Liberation Serif; installed explicitly
      # rather than assumed, since --with-deps may or may not pull it (bench/README.md, fonts row).
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends fonts-liberation
      - if: inputs.mode == 'ci'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: "${{ inputs.artifact }}", path: . }
      - if: inputs.mode == 'ci'
        run: |
          chmod +x site && ./site serve --static --port 8080 &
          for _ in $(seq 1 50); do curl -sf -o /dev/null http://127.0.0.1:8080/ && break; sleep 0.2; done
      - run: node bench/audit.mjs "${{ inputs.base }}" --mode ${{ inputs.mode }} --only checks --dist dist --link "${{ inputs.link }}" --out rows-checks.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: "rows-${{ inputs.mode }}-checks", path: rows-checks.json*, overwrite: true }
  merge:
    needs: [lighthouse, checks]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs: { pass: "${{ steps.gate.outputs.pass }}" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .node-version, cache: npm, cache-dependency-path: bench/package-lock.json }
      - run: cd bench && npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { pattern: "rows-${{ inputs.mode }}-*", path: rows, merge-multiple: true }
      # The gate only records its verdict; the last step of the job acts on it, so the fragment
      # check below runs on a red scorecard too. --expect: a row no job delivered is a red
      # "not measured" row, never a silent gap (a dead job's artifact simply is not in rows/).
      - id: gate
        run: |
          mapfile -t files < <(find rows -name 'rows-*.json' ! -name '*.detail.json' | sort)
          if [ "${{ inputs.mode }}" = ci ]; then
            node bench/merge.mjs --expect ci --out scorecard-ci.json --build "${GITHUB_SHA::7}" --build-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA" --summary "$GITHUB_STEP_SUMMARY" "${files[@]}" && pass=true || pass=false
          else
            node bench/merge.mjs --expect post --out scorecard-post.json --summary "$GITHUB_STEP_SUMMARY" "${files[@]}" && pass=true || pass=false
          fi
          echo "pass=$pass" >> "$GITHUB_OUTPUT"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: "scorecard-${{ inputs.mode }}", path: "scorecard-${{ inputs.mode }}.json", overwrite: true }
      # ci mode: render the fragment these rows will become and validate it with Nu, exactly as
      # scripts/scorecard-publish.sh does before writing KV — so a pull request, which never
      # publishes, still fails when its rows would render into invalid HTML.
      - if: inputs.mode == 'ci'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: "${{ inputs.artifact }}", path: . }
      - if: inputs.mode == 'ci'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with: { distribution: temurin, java-version: "21" }
      - if: inputs.mode == 'ci'
        run: |
          chmod +x site && ./site scorecard --in scorecard-ci.json --manual data/scorecard-manual.yaml --out scorecard.html
          grep -q '<table data-scorecard>' scorecard.html
          { printf '<!doctype html><html lang="en"><head><title>scorecard</title></head><body>'; cat scorecard.html; printf '</body></html>'; } > scorecard-doc.html
          java -jar bench/node_modules/vnu-jar/build/dist/vnu.jar --errors-only --exit-zero-always scorecard-doc.html 2>&1 | tee scorecard-nu.txt
          ! grep -q 'error:' scorecard-nu.txt || { echo "scorecard fragment is not valid HTML"; exit 1; }
      - if: steps.gate.outputs.pass != 'true'
        run: |
          echo "audit gate: a row is red or not measured (the table is in the job summary)"; exit 1
